dataset_root: data/manual_clips_temporal_augmented
pose_output_root: data/processed/manual_clips_2class_poses
additional_pose_output_roots:
  - data/processed/manual_clips_2class_temporal_augmented_poses
annotation_output: data/annotations/manual_clips_2class_temporal_augmented.pkl

classes:
  backhand_drive: 0
  forehand_clear: 1

splits: [train, val]

views:
  front:
    target: single
    image_size: 640
  side:
    target: single
    image_size: 640

quality:
  min_frames: 30
  min_detected_ratio: 0.80
  min_mean_confidence: 0.30

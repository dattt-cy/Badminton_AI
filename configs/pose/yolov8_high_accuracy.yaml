# Higher-cost pose extraction preset for technique assessment.
model: yolov8x-pose.pt
confidence: 0.35
image_size: 960
device: null
tracking_distance_weight: 1.0
max_tracking_distance: 0.15
max_tracking_gap: 5
target_region: any
smoothing:
  enabled: true
  alpha: 0.35
  min_confidence: 0.4
  max_gap: 3
  filter_type: butterworth
  cutoff_hz: 6.0
  filter_order: 2
  reject_outliers: true
  hampel_window_seconds: 0.12
  hampel_n_sigma: 3.0

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <rect width="1600" height="760" rx="34" fill="#F8FAFC"/>
  <style>.year{font:700 18px Arial;fill:white}.h{font:700 30px Arial;fill:#0F172A}.p{font:400 20px Arial;fill:#475569}.m{font:700 21px Arial}.arrow{stroke:#94A3B8;stroke-width:5;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#94A3B8"/></marker></defs>

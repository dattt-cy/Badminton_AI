[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'badminton-ai-classifier'
version = '0.1.0'
description = 'Badminton technique analysis pipeline'
requires-python = '>=3.10'
dependencies = [
    'numpy>=1.24',
    'opencv-python>=4.8',
    'pydantic>=2.7,<3',
    'PyYAML>=6.0',
    'ultralytics>=8.3,<9',
]

[project.optional-dependencies]
test = [
    'pytest>=8.0',
    'fastapi>=0.115,<1',
    'httpx>=0.27,<1',
    'python-multipart>=0.0.18',
]
api = [
    'fastapi>=0.115,<1',
    'python-multipart>=0.0.18',
    'uvicorn[standard]>=0.34,<1',
]

[project.scripts]
badminton-ai-api = 'ai_classifier.api.__main__:main'

[tool.setuptools.packages.find]
where = ['src']

[tool.setuptools.package-data]
'ai_classifier.api' = ['static/*.html']

[tool.pytest.ini_options]
pythonpath = ['src']
testpaths = ['tests']

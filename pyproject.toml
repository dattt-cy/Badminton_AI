[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'badminton-ai-classifier'
version = '0.1.0'
description = 'Badminton technique analysis pipeline'
requires-python = '>=3.10'
dependencies = [
    'numpy>=1.24',
    'opencv-python>=4.8',
    'PyYAML>=6.0',
    'ultralytics>=8.3,<9',
]

[project.optional-dependencies]
test = ['pytest>=8.0']

[tool.setuptools.packages.find]
where = ['src']

[tool.pytest.ini_options]
pythonpath = ['src']
testpaths = ['tests']

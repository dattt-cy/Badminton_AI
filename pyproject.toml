[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'badminton-ai-classifier'
version = '0.1.0'
description = 'Badminton technique analysis pipeline'
requires-python = '>=3.11'
dependencies = [
    'numpy>=1.24',
    'opencv-python>=4.8',
    'pandas>=2.0',
    'joblib>=1.3',
    'PyYAML>=6.0',
    'scikit-learn>=1.8,<1.9',
    'torch>=2.1',
    'torchvision>=0.16',
    'ultralytics>=8.3,<9',
]

[project.optional-dependencies]
api = [
    'fastapi>=0.115,<1',
    'python-multipart>=0.0.20',
    'uvicorn[standard]>=0.34',
]
ocr = [
    'easyocr>=1.7',
]
test = [
    'httpx>=0.28',
    'pytest>=8.0',
]

[tool.setuptools.packages.find]
where = ['src']

[tool.pytest.ini_options]
pythonpath = ['.', 'src']
testpaths = ['tests']
